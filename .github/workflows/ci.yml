name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-traffic-platform-2026-ci-environment-key
          DATABASE_URL: sqlite:///./traffic_platform_test.db
        run: |
          python -m pytest backend/tests -v

  frontend-verify:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci 2>/dev/null || npm install

      - name: Typecheck Frontend Code
        working-directory: frontend
        run: |
          npm run typecheck

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: |
          npm run build
